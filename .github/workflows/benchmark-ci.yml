name: Benchmark CI

# Builds the QuickJS, Boost.Regex, Hermes, PCRE2, SRELL and Node.js engines, links them into
# regex_perf and runs the benchmark on 3200.txt. Runs weekly on Monday and on demand.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pinned dependency revisions, kept in sync with ci/build-deps.sh
  QUICKJS_REF: v0.18.0
  SRELL_REF: v2026.11
  PCRE2_REF: pcre2-10.49
  HERMES_REF: f7b0b8632a926720a777564d1264c027a95bb49f
  BOOST_VERSION: 1.88.0
  DEPS_DIR: ${{ github.workspace }}/.ci-deps
  REPEAT: 3

jobs:
  benchmark:
    name: Build engines and run benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bzip2 \
            cmake \
            curl \
            git \
            ninja-build \
            python3

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Report tool versions
        run: |
          cmake --version | head -1
          ninja --version
          c++ --version | head -1
          node --version
          python3 --version

      # The dependency build is the expensive part of this workflow, so it is cached. The key
      # changes whenever a pinned revision or the build script changes; a restored cache lets
      # ci/build-deps.sh skip the engines that are already built.
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: regex-perf-deps-${{ runner.os }}-qjs-${{ env.QUICKJS_REF }}-srell-${{ env.SRELL_REF }}-pcre2-${{ env.PCRE2_REF }}-hermes-${{ env.HERMES_REF }}-boost-${{ env.BOOST_VERSION }}-${{ hashFiles('ci/build-deps.sh') }}

      - name: Build dependencies
        run: ci/build-deps.sh

      # The Boost source tree and the downloaded archive are only needed to build Boost.Regex;
      # dropping them keeps the cache small. The installed prefix (${DEPS_DIR}/boost) is kept.
      - name: Trim the dependency cache
        run: rm -rf "${DEPS_DIR}/downloads" "${DEPS_DIR}/boost_${BOOST_VERSION//./_}"

      - name: Build regex_perf and run the benchmark
        run: ci/build-and-bench.sh

      - name: Summarize the results
        if: success()
        run: python3 ci/summarize.py ci-results/results.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: |
            ci-results/results.csv
            ci-results/benchmark.log
          if-no-files-found: warn
